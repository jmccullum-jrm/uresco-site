# Builds the site and runs every check on each pull request and push to main.
# Fails if docs/ wasn't rebuilt and committed after a change to src/.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node build.mjs
      - name: docs/ matches the source
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
      - name: Install Chromium for the browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Link, SEO, accessibility and browser checks
        run: node tests/check.mjs
